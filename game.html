<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandwich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --primary: #2b54c9;
      --accent: #e8a93e;
      --on-accent: #ffffff;
      --foreground: #1a2230;
      --muted-foreground: #6b7280;
      --border: #d9dbe0;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      color: var(--foreground);
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100dvh;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 16px 20px;
      display: flex;
      flex-direction: column;
    }

    /* Subtitle / status line */
    .subtitle {
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--foreground);
      min-height: 50px;
      padding: 0 8px;
      text-wrap: balance;
    }
    .subtitle em { font-style: italic; }
    .subtitle.step-in { animation: step-in 0.26s cubic-bezier(0, 0, 0.2, 1) both; }
    @keyframes step-in {
      0% { opacity: 0; transform: translateY(9px); }
    }

    /* Word wheel */
    .wheel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 32px 8px;
    }
    .bound {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--foreground);
      text-transform: uppercase;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .bound.far {
      opacity: 0.35;
      font-size: 15px;
      font-weight: 600;
      min-height: 22px;
    }
    /* Keep the reserved row height so the wheel never jumps. */
    .bound.far.empty { visibility: hidden; }
    /* Closeness readout sits inline after a guessed bound word: just text,
       no border or fill. Sized relative to the word so the far (smaller)
       bounds scale their readout down too. */
    .bound-meta {
      margin-left: 0.5em;
      font-size: 0.62em;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted-foreground);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.15em;
    }
    /* Thermometer icon: mercury height + colour set inline per guess. The
       outline uses currentColor, so it inherits the muted meta text colour. */
    .thermo-icon {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.2em;
      flex: 0 0 auto;
    }

    .bound.move-top { animation: move-to-top 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    @keyframes move-to-top {
      0% { opacity: 0; transform: translateY(46px) scale(1.08); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bound.move-bottom { animation: move-to-bottom 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    @keyframes move-to-bottom {
      0% { opacity: 0; transform: translateY(-46px) scale(1.08); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Thermometer (mode: 'thermometer' only) ------------------------------
       Lives OUTSIDE .wheel, so the wheel's five rows and its reserved
       ghost-row height are untouched. Alignment is structural rather than
       measured: .thermo mirrors .wheel's padding (32px), its gap (8px) and
       the 22px reserved height of .bound.far top and bottom, and the tube
       takes the rest. With hB as a bound row's height that makes the tube
       80 + 2*hB tall, which is exactly the span from the top of the top
       bound to the bottom of the bottom bound -- for ANY font metrics, with
       no pixel measurement, no resize listener and no fonts.ready wait. */
    .wheel-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 12px;
    }
    /* The one property .wheel gains: it must absorb the remaining width.
       Its heights and its rows are untouched. */
    .wheel-row > .wheel { flex: 1 1 auto; min-width: 0; }

    .thermo,
    .thermo-spacer { flex: 0 0 14px; width: 14px; }
    /* Hidden in the other two arms, which therefore lay out exactly as
       before -- no tube, and no gap where one would be. */
    .thermo[hidden],
    .thermo-spacer[hidden] { display: none; }

    .thermo {
      display: flex;
      flex-direction: column;
      gap: 8px;          /* matches .wheel */
      padding: 32px 0;   /* matches .wheel */
    }
    .thermo-pad { flex: 0 0 22px; }   /* matches .bound.far's reserved height */

    .thermo-tube {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;                     /* the jaws anchor to this */
      border-radius: 999px;
      overflow: hidden;
      background: rgba(232, 169, 62, 0.16);   /* --accent at low alpha */
    }
    /* Two jaws closing in from top and bottom. The GAP between them is what is
       still in play, so the tube empties as the player closes in. */
    .thermo-jaw {
      position: absolute;
      left: 0;
      right: 0;
      height: 0;
      transition: height 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    /* Amber deepens toward the closing edge, so the eye is pulled to the gap. */
    .thermo-jaw-top {
      top: 0;
      background: linear-gradient(180deg, rgba(232, 169, 62, 0.40), var(--accent));
    }
    .thermo-jaw-bottom {
      bottom: 0;
      background: linear-gradient(0deg, rgba(232, 169, 62, 0.40), var(--accent));
    }

    .input-card {
      width: 100%;
      max-width: 360px;
      height: 64px;
      border: 2.5px solid var(--accent);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0 auto;
    }
    .input-card.shake { animation: shake 0.5s; }
    .input-card.solved {
      border-color: var(--accent);
      background: var(--accent);
      color: #1a2230;
    }
    .thinking-dots {
      letter-spacing: 0.15em;
      color: var(--muted-foreground);
    }
    .thinking-dots::after {
      content: "\00B7";
      animation: thinking 1s steps(1, end) infinite;
    }
    @keyframes thinking {
      0% { content: "\00B7"; }
      33% { content: "\00B7\00B7"; }
      66% { content: "\00B7\00B7\00B7"; }
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-3px); }
      40%, 60% { transform: translateX(3px); }
    }
    .slot-empty { opacity: 0.4; }
    /* Locking mode: a proven letter, shown as a filled pill so it clearly
       reads as locked in place rather than just typed. */
    .slot-lock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.1em;
      padding: 0.08em 0.28em;
      margin: 0 0.04em;
      border-radius: 8px;
      background: var(--accent);
      color: #1a2230;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
    }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Guesses left */
    .guesses {
      text-align: center;
      color: var(--muted-foreground);
      margin: 4px 0 0;
    }
    .guesses strong { color: var(--foreground); }

    /* Inline validity message. Height is reserved so the keyboard never shifts,
       the same approach .bound.far.empty uses for the ghost rows. */
    .notice {
      text-align: center;
      font-size: 14px;
      line-height: 1.3;
      color: var(--muted-foreground);
      min-height: 34px;
      padding: 8px 8px 0;
      text-wrap: balance;
      opacity: 0;
      transition: opacity 0.26s cubic-bezier(0, 0, 0.2, 1);
    }
    .notice.show { opacity: 1; }

    /* Keyboard */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .krow {
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    /* Default state = an AVAILABLE letter: solid, raised and clearly tappable. */
    .key {
      flex: 1 1 0;
      min-width: 0;
      height: 48px;
      border: 1px solid #c3c7d0;
      border-bottom-width: 3px;
      border-radius: 7px;
      background: #e9ebef;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      color: var(--foreground);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s,
        box-shadow 0.12s, transform 0.08s;
    }
    .key:hover { background: #dfe2e8; }
    .key.wide {
      flex: 1.6 1 0;
      background: #d5d8de;
      border-color: #b2b7c1;
      font-weight: 700;
    }
    .key.wide:hover { background: #cbcfd6; }
    .key:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }
    /* Unavailable letter: flat, low-contrast and recessed so it clearly reads
       as "you can't use this". */
    .key.dim {
      background: transparent;
      border-color: transparent;
      color: #bcc0c8;
      font-weight: 500;
      box-shadow: none;
      cursor: default;
      pointer-events: none;
    }
    .key svg { width: 20px; height: 20px; }

    /* End-of-game prompt */
    .prompt {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
      z-index: 20;
    }
    .prompt[hidden] { display: none; }
    .prompt-card {
      pointer-events: auto;
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
      padding: 16px 18px;
      text-align: center;
      animation: prompt-in 0.28s cubic-bezier(0, 0, 0.2, 1) both;
    }
    @keyframes prompt-in {
      0% { opacity: 0; transform: translateY(16px); }
    }
    .prompt-text {
      font-size: 15px;
      line-height: 1.4;
      color: var(--foreground);
      text-wrap: balance;
    }
    .prompt-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }
    .btn {
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border-radius: 999px;
      padding: 8px 20px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--foreground);
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a2230;
    }
    .seed-line {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    /* Start screen. Same overlay mechanism as .prompt (the hidden attribute),
       but covering the board because it gates play. */
    .start {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(26, 34, 48, 0.55);
      animation: fade 0.26s cubic-bezier(0, 0, 0.2, 1) both;
    }
    .start[hidden] { display: none; }
    @keyframes fade { 0% { opacity: 0; } }
    .start-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.35);
      padding: 26px 20px 22px;
      text-align: center;
      animation: prompt-in 0.28s cubic-bezier(0, 0, 0.2, 1) both;
    }
    .start-title {
      font-family: "Literata", Georgia, serif;
      font-weight: 700;
      font-size: 32px;
    }
    .start-sub {
      margin-top: 6px;
      font-size: 15px;
      line-height: 1.4;
      color: var(--muted-foreground);
      text-wrap: balance;
    }
    .start-label {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-foreground);
    }
    /* All three arms get identical visual weight: styling one as primary would
       read as a recommendation and bias the choice. */
    .start-modes {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .start-modes .btn { width: 100%; }

    /* Nothing here is load-bearing motion: every entrance animation uses "both"
       fill, so a near-zero duration settles on its end state. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <p class="subtitle" id="subtitle">
      Find the word <em>alphabetically</em> in between
    </p>

    <div class="wheel-row">
      <div class="thermo" id="thermo" role="img"
           aria-label="Gauge showing how much of the range is still left to search" hidden>
        <div class="thermo-pad"></div>
        <div class="thermo-tube">
          <div class="thermo-jaw thermo-jaw-top" id="thermoJawTop"></div>
          <div class="thermo-jaw thermo-jaw-bottom" id="thermoJawBottom"></div>
        </div>
        <div class="thermo-pad"></div>
      </div>

      <div class="wheel">
        <div class="bound far empty" id="boundTopFar"></div>
        <div class="bound" id="boundTop">ART</div>
        <div class="input-card" id="inputCard"></div>
        <div class="bound" id="boundBottom">CAN</div>
        <div class="bound far empty" id="boundBottomFar"></div>
      </div>

      <!-- Keeps the wheel centred in the row, so the composition doesn't
           shift sideways in thermometer mode only. -->
      <div class="thermo-spacer" id="thermoSpacer" aria-hidden="true" hidden></div>
    </div>

    <p class="guesses">Guesses left: <strong id="guessesLeft">10</strong></p>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>

    <div class="keyboard" id="keyboard"></div>
  </div>

  <!-- End-of-game prompt -->
  <div class="prompt" id="promptOverlay" hidden>
    <div class="prompt-card">
      <p class="prompt-text" id="promptText"></p>
      <div class="prompt-actions">
        <button class="btn" id="promptModes">Change mode</button>
        <button class="btn btn-primary" id="promptAgain">Play again</button>
      </div>
      <p class="seed-line" id="promptSeed"></p>
    </div>
  </div>

  <!-- Start screen: the first thing shown on load -->
  <div class="start" id="startOverlay">
    <div class="start-card">
      <h1 class="start-title">Sandwich</h1>
      <p class="start-sub">
        Find the secret word hidden <em>alphabetically</em> between two others.
      </p>
      <p class="start-label">Choose a feedback mode</p>
      <div class="start-modes">
        <button class="btn" data-mode="percent">Percentage</button>
        <button class="btn" data-mode="locking">Locking</button>
      </div>
      <p class="seed-line" id="startSeed"></p>
    </div>
  </div>

      // Built from a frequency-ranked list intersected with Webster's 2nd, then
      // pruned of proper nouns, abbreviations, non-English fragments and crude

        "wish", "wishing", "wit", "witch", "witness", "wizard", "wolf", "woman", "won", "wonder",
        "wood", "wooden", "wool", "word", "work", "worked", "worker", "working", "workout", "world",
        "worm", "worn", "worried", "worry", "worse", "worship", "worst", "worth", "worthy", "wound",
        "wow", "wrap", "wrapped", "wrist", "write", "writer", "writing", "written", "wrong", "wrote",
        "yacht", "yang", "yard", "yarn", "yeah", "year", "yearly", "yeast", "yellow", "yen",
        "yield", "yoga", "young", "younger", "youth", "zero", "zinc", "zip", "zone", "zoning",
        "zoo", "zoom"
      ];

      // ---- Difficulty. The feedback mode is the only thing that changes
      // between arms; these constants set the shared challenge. ----
      // WINDOW_WORDS is THE gap dial: the number of legal same-length words
      // that sit strictly between the two bounds -- the space the player must
      // bisect. Bisection needs ~log2(W) guesses. The % readout lets a player
      // interpolate the answer's rough position from just a couple of guesses,
      // so it pins a narrow gap down fast -- 200 gives it more room to search
      // (optimal solve ~7-8 against a 10-guess budget) without becoming brutal.
      // Generation auto-clamps to the band size and logs if a band is ever too
      // small to hold this many. Raise toward 260 if playtesting says it's soft.
      var WINDOW_WORDS  = 200;  // legal guesses (WORDS of the answer's length) between the bounds

      // Locking gets a MUCH wider window, on purpose. Its difficulty is not the
      // word count but how far the deciding letters spread: a narrow window
      // lets the two bounds share leading letters (CRANE..CREST), handing the
      // player the first letters for free and leaving only a tiny tail to
      // discover. A wide window forces the bounds apart across the alphabet
      // (about..youth is the 5-letter extreme), so the FIRST letter -- the
      // highest-value position -- is genuinely unknown. 300 is ~36% of the
      // 826-word 5-letter band: wide enough that early letters must be earned,
      // narrow enough that most answers still get a varied, centred window
      // rather than always snapping to the band ends. % mode ignores spread,
      // so it keeps the tighter WINDOW_WORDS.
      var WINDOW_WORDS_LOCKING = 300;

      var MAX_GUESSES   = 10;
      var ANSWER_LENGTH = 5;

      // The gap dial for a given mode. Locking widens; everything else uses the
      // shared default.
      function windowForMode(mode) {
        return mode === "locking" ? WINDOW_WORDS_LOCKING : WINDOW_WORDS;
      }

      // ---- Thermometer (mode: 'thermometer' only) ----
      // How hard the gauge compresses the search space. 0 = linear, where the
      // last few guesses squash into a sliver and the gauge dies. 1 = fully
      // logarithmic, where every halving of the space closes the jaws by an
      // equal step. 1 is the default because bisection is the skill this game
      // trains, and log makes each successful halving read identically. Lower
      // it toward 0 if playtesters say early guesses feel unrewarding.
      // EXPECT TO RETUNE after playtesting, and to re-derive against the
      // production dictionary, whose rank density differs from this list's.
      var THERMO_LOG_MIX = 1;

      var MODES = ["control", "percent", "locking"];

      var DEFAULT_MSG = 'Find the word <em>alphabetically</em> in between';

      // ---- Indexes, built once ----
      var RANK = new Map();            // word -> index in WORDS
      var BY_LENGTH = new Map();       // length -> sorted array of WORDS of that length
      var RANK_IN_LENGTH = new Map();  // word -> index within its BY_LENGTH band
      var ANSWERS_BY_LENGTH = new Map();

      (function buildIndexes() {
        var i, w;
        for (i = 0; i < WORDS.length; i++) {
          w = WORDS[i];
          RANK.set(w, i);
          if (!BY_LENGTH.has(w.length)) BY_LENGTH.set(w.length, []);
          var band = BY_LENGTH.get(w.length);
          RANK_IN_LENGTH.set(w, band.length);
          band.push(w);
        }
        for (i = 0; i < ANSWERS.length; i++) {
          w = ANSWERS[i];
          if (!ANSWERS_BY_LENGTH.has(w.length)) ANSWERS_BY_LENGTH.set(w.length, []);
          ANSWERS_BY_LENGTH.get(w.length).push(w);
        }
      })();

      function rankOf(word) {
        return RANK.has(word) ? RANK.get(word) : -1;
      }

      // Smallest i with arr[i] >= key.
      function firstIndexAtOrAfter(arr, key) {
        var lo = 0, hi = arr.length;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (arr[mid] < key) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      }

      // All WORDS strictly between a and b. Kept for reporting; NOT the
      // difficulty dial -- wordsBetweenOfLength is.
      function wordsBetween(a, b) {
        var ra = rankOf(a), rb = rankOf(b);
        if (ra < 0 || rb < 0) return 0;
        return Math.max(0, rb - ra - 1);
      }

      // The legal-guess count: WORDS of `len` strictly between a and b. This is
      // the space the player actually searches, so it is the metric that matters.
      function wordsBetweenOfLength(a, b, len) {
        var band = BY_LENGTH.get(len) || [];
        var i = firstIndexAtOrAfter(band, a);
        if (i < band.length && band[i] === a) i++;
        return Math.max(0, firstIndexAtOrAfter(band, b) - i);
      }

      // ---- Logging ----------------------------------------------------------
      // Shape is what matters here: point this at real analytics later by
      // swapping the console.log. Seed rides on every event, which is what makes
      // an arm-vs-arm comparison joinable.
      function logEvent(name, payload) {
        var data = {
          event: name,
          at: Date.now(),
          mode: state ? state.mode : null,
          seed: state ? state.seed : null
        };
        if (payload) {
          for (var k in payload) {
            if (Object.prototype.hasOwnProperty.call(payload, k)) data[k] = payload[k];
          }
        }
        console.log("[sandwich] " + name, data);
      }

      // ---- Puzzle generation ------------------------------------------------
      function mulberry32(a) {
        return function () {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          var t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function randomSeed() {
        return Math.floor(Math.random() * 1000000000);
      }

      // Places the bounds so that exactly `w` WORDS of the answer's length sit
      // strictly between them. Returns null when the answer is too close to an
      // end of its band to leave room.
      function boundsAround(answer, w) {
        var band = BY_LENGTH.get(answer.length) || [];
        if (band.length < w + 2) return null;
        var j = RANK_IN_LENGTH.get(answer);
        if (j === undefined || j < 1 || j > band.length - 2) return null;
        var half = Math.floor(w / 2);
        var lo = j - half - 1;
        if (lo < 0) lo = 0;
        if (lo + w + 1 > band.length - 1) lo = band.length - 2 - w;
        if (j < lo + 1 || j > lo + w) return null;
        return {
          answer: answer,
          lower: band[lo],
          upper: band[lo + w + 1],
          window: w
        };
      }

      function eligibleAnswers(len, w) {
        var pool = ANSWERS_BY_LENGTH.get(len) || [];
        var out = [];
        for (var i = 0; i < pool.length; i++) {
          if (boundsAround(pool[i], w)) out.push(pool[i]);
        }
        return out;
      }

      // (seed, length, windowWords) fully determines the puzzle. Mode is NOT an
      // input, so the same seed yields the identical puzzle in every arm.
      function generatePuzzle(seed, options) {
        var o = options || {};
        var len = o.length || ANSWER_LENGTH;
        var band = BY_LENGTH.get(len) || [];
        var asked = o.windowWords || WINDOW_WORDS;
        var w = Math.min(asked, band.length - 2);
        if (w < asked) {
          logEvent("window_clamped", { length: len, asked: asked, used: w });
        }
        var pool = eligibleAnswers(len, w);
        if (!pool.length) {
          logEvent("no_eligible_answers", { length: len, windowWords: w });
          return null;
        }
        var rnd = mulberry32(seed);
        return boundsAround(pool[Math.floor(rnd() * pool.length)], w);
      }

      var QUERY = (function readQuery() {
        var q = {}, p;
        try {
          p = new URLSearchParams(window.location.search);
        } catch (e) {
          return q;
        }
        function num(name) {
          var v = parseInt(p.get(name), 10);
          return isNaN(v) ? null : v;
        }
        function word(name) {
          var v = p.get(name);
          return v ? v.toLowerCase().replace(/[^a-z]/g, "") : null;
        }
        q.seed = num("seed");
        q.length = num("length");
        q.windowWords = num("window");
        q.answer = word("answer");
        q.lower = word("lower");
        q.upper = word("upper");
        var mode = p.get("mode");
        q.mode = mode && MODES.indexOf(mode) >= 0 ? mode : null;
        return q;
      })();

      // Honours ?answer= / ?lower= / ?upper= for testing, falling back to a
      // seeded puzzle (with a log) rather than failing silently. The mode sets
      // the default gap width (locking is wider) unless ?window= overrides it.
      function buildPuzzle(seed, mode) {
        var defaultWindow = windowForMode(mode);
        var opts = {
          length: QUERY.length,
          windowWords: QUERY.windowWords || defaultWindow
        };
        if (QUERY.answer) {
          if (!RANK.has(QUERY.answer)) {
            logEvent("forced_answer_unknown", { answer: QUERY.answer });
          } else {
            var w = QUERY.windowWords || defaultWindow;
            var forced = boundsAround(QUERY.answer, w);
            if (forced) {
              if (QUERY.lower && RANK.has(QUERY.lower)) forced.lower = QUERY.lower;
              if (QUERY.upper && RANK.has(QUERY.upper)) forced.upper = QUERY.upper;
              if (forced.lower < forced.answer && forced.answer < forced.upper) {
                return forced;
              }
              logEvent("forced_bounds_invalid", forced);
            } else {
              logEvent("forced_answer_unplaceable", { answer: QUERY.answer });
            }
          }
        }
        return generatePuzzle(seed, opts);
      }

      // ---- State ------------------------------------------------------------
      var state;
      var currentSeed;

      function initialState(opts) {
        var o = opts || {};
        var puzzle = o.puzzle;
        return {
          mode: o.mode || "control",
          seed: o.seed,
          answer: puzzle.answer,

          // The opening window, and the DENOMINATOR the thermometer gauge
          // measures against -- see gaugeParts().
          //
          // This reverses earlier guidance, so the reasoning is worth keeping:
          // a gauge showing the answer's POSITION must normalise against the
          // live window, because keyed to the original window it goes dead once
          // the bounds tighten. But the gauge shows how much SPACE IS LEFT, and
          // for that the opening window is the only meaningful baseline. What
          // stops it dying is the log scaling in THERMO_LOG_MIX: linear would
          // run 100 -> 50 -> 23 -> 12 -> 5 -> 2, squashing the endgame into a
          // sliver, where log runs 100 -> 84 -> 66 -> 51 -> 34 -> 17.
          startLower: puzzle.lower,
          startUpper: puzzle.upper,

          lower: puzzle.lower,
          upper: puzzle.upper,
          prevLower: null,
          prevUpper: null,
          typed: "",
          guesses: [],
          guessesLeft: MAX_GUESSES,
          solved: false,
          gameOver: false,
          thinking: false,
          shake: false,
          boundSide: null, // 'top' | 'bottom' just moved
          message: DEFAULT_MSG,
          notice: null,

          // Locking mode: the longest run of leading letters the player has
          // proven correct (a prefix the guess shares with the answer is, by
          // definition, correct). Accumulates across guesses; never shrinks.
          locked: ""
        };
      }

      // ---- Keyboard availability --------------------------------------------
      // Availability is ALPHABETICAL ONLY, and deliberately so. The keyboard
      // must never consult the word list: a dictionary-aware keyboard leaks the
      // answer list, because a player could walk the alphabet and read off
      // which letters have real words behind them -- information they are
      // supposed to be deducing. The keyboard only ever confirms what the
      // bounds already imply.
      //
      // So the keyboard and guessProblem() DO disagree, on the dictionary, and
      // that is correct: BZZZZ is typeable between two bounds and is rejected
      // at Enter with "isn't in the word list". The keyboard is stricter than
      // alphabetical viability on length alone (see keyState), because typing
      // past the answer's length carries no information and can only produce a
      // pointless rejection.

      // Sentinel greater than any lowercase letter run ("{" is 0x7B, just past
      // "z" at 0x7A), so prefix + HI stands for the largest word starting with
      // prefix. NOTE: it is a fixed 12 characters, so a prefix whose bound
      // differs from it only beyond prefix.length + 12 would be misjudged.
      // Unreachable with 3-7 letter words; it would matter if the list ever
      // carried longer ones.
      var HI = "{{{{{{{{{{{{";

      // A prefix is viable if some completion lands between the bounds --
      // whether or not any real word does.
      //
      // Both comparisons are deliberately INCLUSIVE of the bound words, and
      // symmetrically so: "hi > lower" admits a prefix equal to the lower
      // bound, and "prefix <= upper" admits one equal to the upper bound. Do
      // not tighten either to exclude them. Dimming a bound word would mean
      // the keyboard excluding a key because of one specific word rather than
      // the range -- the dictionary leak in miniature -- and it would read as
      // a bug, with UNCL fine and its E dead. Typing a bound costs one wasted
      // guess at most, and guessProblem() explains it clearly.
      function viable(prefix) {
        if (!prefix) return true;
        var hi = prefix + HI;
        return hi > state.lower && prefix <= state.upper;
      }

      function keyState(letter) {
        if (state.gameOver || state.thinking) return "dim";
        // The length cap: the only way the keyboard is stricter than the old
        // sentinel check.
        if (state.typed.length >= state.answer.length) return "dim";
        if (!viable(state.typed + letter)) return "dim";
        // Locking mode adds one more, TIGHTER constraint at the first unlocked
        // position: letters a guess already ruled out there are dimmed. If the
        // answer's letter were that one, the lock would have extended to cover
        // it -- so a guessed letter that did NOT lock is provably wrong, and
        // the direction (which bound the guess became) rules out everything
        // past it too. Only applies once the player has typed exactly the
        // locked prefix, i.e. is choosing that very position.
        if (state.mode === "locking" && state.typed === state.locked) {
          var e = lockPositionRange();
          if (e.below !== null && letter <= e.below) return "dim";
          if (e.above !== null && letter >= e.above) return "dim";
        }
        return "enabled";
      }

      // Returns the reason a guess is rejected, or null when it is legal.
      // All but the first branch are reachable, because the keyboard checks
      // alphabetical possibility only:
      //   empty        - no: Enter is dim with nothing typed
      //   wrong length - yes, on a partial word (the cap prevents over-long)
      //   out of bounds- yes, by typing the lower bound exactly. viable() lets
      //                  it through (prefix + HI > lower even when prefix
      //                  equals lower) while the upper bound is strict. Do
      //                  not tighten either to exclude them. Dimming a bound word
      //                  would mean the keyboard excluding a key because of one
      //                  specific word rather than the range -- the dictionary
      //                  leak in miniature -- and it would read as a bug.
      function guessProblem() {
        var t = state.typed;
        if (!t) return "Type a word to guess.";
        if (t.length !== state.answer.length) {
          return "The answer has " + state.answer.length + " letters.";
        }
        if (!(state.lower < t && t < state.upper)) {
          return "Must come between " + state.lower.toUpperCase() +
            " and " + state.upper.toUpperCase() + ".";
        }
        return null;
      }

      function guessValid() {
        return guessProblem() === null;
      }

      // Live whenever something is typed, so submit() can explain the one
      // reachable rejection. Dimming it would make that message unreachable,
      // since .key.dim sets pointer-events: none.
      function enterState() {
        if (state.gameOver || state.thinking) return "dim";
        return state.typed ? "enabled" : "dim";
      }

      // ---- Actions ----
      function typeLetter(l) {
        if (state.gameOver || state.thinking) return;
        if (keyState(l) !== "enabled") return;
        state.typed += l;
        state.notice = null;
        render();
      }

      function backspace() {
        if (state.gameOver || state.thinking || !state.typed) return;
        state.typed = state.typed.slice(0, -1);
        state.notice = null;
        render();
      }

      function submit() {
        if (state.gameOver || state.thinking) return;
        var problem = guessProblem();
        if (problem) {
          state.notice = problem;
          state.shake = true;
          render();
          return;
        }
        state.notice = null;
        state.thinking = true;
        render();
        setTimeout(resolveGuess, 750);
      }

      function resolveGuess() {
        state.thinking = false;
        var w = state.typed;

        // Locking mode bookkeeping: extend the proven prefix. Runs for every
        // guess, win or miss, so the tiles are up to date the moment the board
        // settles. Harmless in the other modes -- renderLocks gates on mode.
        updateLocks(w);

        // Win first: a correct guess must not consume a guess.
        if (w === state.answer) {
          state.guesses.push({ word: w, direction: "correct" });
          state.solved = true;
          state.gameOver = true;
          state.typed = w;
          state.message = "You found the secret word!";
          logEvent("win", {
            answer: state.answer,
            guessesUsed: state.guesses.length,
            guessesRemaining: state.guessesLeft
          });
          render();
          showPrompt("Nice one — you found <strong>" +
            w.toUpperCase() + "</strong>!");
          return;
        }

        state.guessesLeft = Math.max(0, state.guessesLeft - 1);

        // direction: which bound this guess became -- "lower" means the answer
        // is after it, "upper" means before it. "correct" for the winner.
        var direction = w < state.answer ? "lower" : "upper";
        state.guesses.push({ word: w, direction: direction });

        if (direction === "lower") {
          state.prevLower = state.lower;
          state.lower = w;
          state.boundSide = "top";
        } else {
          state.prevUpper = state.upper;
          state.upper = w;
          state.boundSide = "bottom";
        }

        // Fired after the bound swap, so the gauge fields match what the player
        // is shown. Logged in ALL arms, not just thermometer: it costs nothing,
        // stays invisible, and makes "what would a control player have seen
        // here" answerable. gaugeGap is the series to judge the arm on -- how
        // fast a player closes the space.
        var gauge = gaugeParts();
        logEvent("guess", {
          word: w,
          direction: direction,
          rankDistance: Math.abs(rankOf(w) - rankOf(state.answer)),
          legalGuessesLeftInWindow:
            wordsBetweenOfLength(state.lower, state.upper, state.answer.length),
          openingWindow: gauge.opening,
          gaugeGap: Math.round(gauge.gap * 1000) / 1000,
          gaugeClosedBelow: gauge.below,
          gaugeClosedAbove: gauge.above,
          guessesRemaining: state.guessesLeft,
          lower: state.lower,
          upper: state.upper
        });

        state.message =
          "Now find the word between " +
          state.lower.toUpperCase() +
          " and " +
          state.upper.toUpperCase();
        state.typed = "";

        if (state.guessesLeft <= 0) {
          state.gameOver = true;
          state.message =
            "Out of guesses — the word was " + state.answer.toUpperCase() + ".";
          logEvent("loss", {
            answer: state.answer,
            guessesUsed: state.guesses.length
          });
          render();
          showPrompt("The word was <strong>" + state.answer.toUpperCase() +
            "</strong>. Try again?");
          return;
        }

        render();
      }

      // ---- Thermometer ----------------------------------------------------
      // The gauge shows HOW MUCH OF THE SEARCH SPACE IS STILL IN PLAY -- not
      // where the answer sits. An earlier version showed the answer's position
      // between the bounds and was unreadable, for two measured reasons:
      //
      //   * It is computed in RANK, while the only reference a player has is
      //     how the two bound words LOOK. Those disagree by a median of 0.15 of
      //     the tube, and by more than 0.10 in 64% of puzzles: TODAY..WAGES
      //     with answer TURBO read 51% while the words look like 10%. In the
      //     player's only frame of reference the gauge was misreporting.
      //   * Its trajectory was noise. Under flawless bisection it read
      //     69 -> 38 -> 85 -> 67 -> 0 -> 50, while the quantity actually
      //     improving -- 60 -> 30 -> 14 -> 7 -> 3 -> 1 candidates -- was never
      //     shown. Crawling one word at a time looked almost identical.
      //
      // Remaining space fixes all of that: it only ever shrinks, it needs no
      // rank intuition because it claims no position, and it separates a good
      // guess from a wasted one. It leaks nothing either -- every number here
      // is already determined by the two bound words on screen. It just makes
      // legible that MILK..STAR holds hundreds of candidates and WIRED..WORLD
      // holds three.
      //
      // Measured with wordsBetweenOfLength throughout, so the gauge, the
      // windowWords difficulty dial and the log all speak in legal guesses.
      function gaugeParts() {
        var len = state.answer.length;
        var opening   = wordsBetweenOfLength(state.startLower, state.startUpper, len);
        var remaining = wordsBetweenOfLength(state.lower, state.upper, len);
        if (opening <= 1) {
          return { gap: 1, top: 0, bottom: 0,
                   opening: opening, remaining: remaining, below: 0, above: 0 };
        }

        // The gap never reaches zero: remaining is always >= 1 because the
        // answer is itself a candidate, so the floor is log(2)/log(opening+1),
        // about 0.17 -- a visible sliver meaning "one word left". No clamp.
        var linear = remaining / opening;
        var logged = Math.log(remaining + 1) / Math.log(opening + 1);
        var gap = (1 - THERMO_LOG_MIX) * linear + THERMO_LOG_MIX * logged;

        // Candidates each bound has eaten: those beyond it, plus the bound word
        // itself once it has moved off the opening bound. Splitting the closed
        // space this way makes an asymmetric squeeze visible, so the player can
        // see WHICH of their guesses did the work.
        var below = wordsBetweenOfLength(state.startLower, state.lower, len) +
          (state.lower !== state.startLower ? 1 : 0);
        var above = wordsBetweenOfLength(state.upper, state.startUpper, len) +
          (state.upper !== state.startUpper ? 1 : 0);

        var closed = 1 - gap;
        var share = (below + above) === 0 ? 0.5 : below / (below + above);
        return { gap: gap, top: closed * share, bottom: closed * (1 - share),
                 opening: opening, remaining: remaining, below: below, above: above };
      }

      // ---- Rendering ----
      var subtitleEl = document.getElementById("subtitle");
      var boundTopEl = document.getElementById("boundTop");
      var boundBottomEl = document.getElementById("boundBottom");
      var boundTopFarEl = document.getElementById("boundTopFar");
      var boundBottomFarEl = document.getElementById("boundBottomFar");
      var inputCardEl = document.getElementById("inputCard");
      var guessesLeftEl = document.getElementById("guessesLeft");
      var noticeEl = document.getElementById("notice");
      var keyboardEl = document.getElementById("keyboard");
      var thermoEl = document.getElementById("thermo");
      var thermoSpacerEl = document.getElementById("thermoSpacer");
      var thermoJawTopEl = document.getElementById("thermoJawTop");
      var thermoJawBottomEl = document.getElementById("thermoJawBottom");

      var ROWS = [
        "qwertyuiop".split(""),
        "asdfghjkl".split(""),
        ["enter"].concat("zxcvbnm".split("")).concat(["back"])
      ];

      var BACK_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"></path><path d="m12 9 6 6"></path><path d="m18 9-6 6"></path></svg>';

      function buildKeyboard() {
        keyboardEl.innerHTML = "";
        ROWS.forEach(function (row) {
          var rowEl = document.createElement("div");
          rowEl.className = "krow";
          row.forEach(function (k) {
            var btn = document.createElement("button");
            btn.type = "button";
            if (k === "enter") {
              btn.className = "key wide";
              btn.textContent = "Enter";
              btn.dataset.action = "enter";
            } else if (k === "back") {
              btn.className = "key wide";
              btn.innerHTML = BACK_SVG;
              btn.dataset.action = "back";
            } else {
              btn.className = "key";
              btn.textContent = k.toUpperCase();
              btn.dataset.letter = k;
            }
            rowEl.appendChild(btn);
          });
          keyboardEl.appendChild(rowEl);
        });

        keyboardEl.addEventListener("click", function (e) {
          var btn = e.target.closest("button");
          if (!btn) return;
          if (btn.dataset.action === "enter") submit();
          else if (btn.dataset.action === "back") backspace();
          else if (btn.dataset.letter) typeLetter(btn.dataset.letter);
        });
      }

      function dashes(n) {
        var parts = [];
        for (var i = 0; i < n; i++) parts.push("&ndash;");
        return parts.join("&nbsp;");
      }

      // ---- Closeness readout ----------------------------------------------
      // How near a guess landed to the answer, measured on the same
      // alphabetical number-line the whole game runs on -- nothing here
      // consults the hidden word list, so it stays player-verifiable. 100%
      // means the guess sits on the answer; 0% means a full opening-window away.
      function alphaValueLen(w, len) {
        var v = 0;
        for (var i = 0; i < len; i++) {
          var c = i < w.length ? w.charCodeAt(i) - 97 : 0;
          if (c < 0) c = 0;
          if (c > 25) c = 25;
          v = v * 26 + c;
        }
        return v;
      }

      function closenessPct(word) {
        var len = state.answer.length;
        var span = Math.abs(
          alphaValueLen(state.startUpper, len) - alphaValueLen(state.startLower, len)
        );
        if (span < 1) span = 1;
        var d = Math.abs(alphaValueLen(word, len) - alphaValueLen(state.answer, len));
        var c = 1 - d / span;
        if (c < 0) c = 0;
        if (c >= 1) return "100"; // exact answer only

        // One decimal, and never allow a non-exact guess to round up to 100:
        // floor to the tenth so 99.97% reads 99.9%, keeping 100% meaningful.
        var pct = Math.floor(c * 1000) / 10;
        if (pct >= 100) pct = 99.9;
        return pct.toFixed(1);
      }

      // The same closeness as a raw 0..1 ratio, for driving the thermometer
      // icon (fill height and heat colour). Kept separate from closenessPct so
      // the displayed number and the icon can never drift apart in rounding.
      function closenessRatio(word) {
        var len = state.answer.length;
        var span = Math.abs(
          alphaValueLen(state.startUpper, len) - alphaValueLen(state.startLower, len)
        );
        if (span < 1) span = 1;
        var d = Math.abs(alphaValueLen(word, len) - alphaValueLen(state.answer, len));
        var c = 1 - d / span;
        if (c < 0) c = 0;
        if (c > 1) c = 1;
        return c;
      }

      // Cold (blue) -> warm (amber) -> hot (red), so the colour reinforces the
      // number at a glance.
      function heatColor(ratio) {
        var stops = [[59, 110, 165], [232, 169, 62], [214, 69, 69]];
        var seg = ratio < 0.5 ? 0 : 1;
        var t = ratio < 0.5 ? ratio / 0.5 : (ratio - 0.5) / 0.5;
        var a = stops[seg], b = stops[seg + 1];
        var r = Math.round(a[0] + (b[0] - a[0]) * t);
        var g = Math.round(a[1] + (b[1] - a[1]) * t);
        var bl = Math.round(a[2] + (b[2] - a[2]) * t);
        return "rgb(" + r + "," + g + "," + bl + ")";
      }

      // A small thermometer whose mercury rises with closeness and takes the
      // heat colour. Bulb is always filled; the stem fills from the bulb up to
      // `ratio` of its height.
      function thermoIconHTML(ratio) {
        var color = heatColor(ratio);
        var stemTop = 4, stemBottom = 15.5, usable = stemBottom - stemTop;
        var mercTop = stemBottom - ratio * usable;
        return '<svg class="thermo-icon" viewBox="0 0 24 24" aria-hidden="true">' +
          // outline
          '<rect x="9" y="2" width="6" height="15" rx="3" fill="none" ' +
            'stroke="currentColor" stroke-width="1.6"/>' +
          '<circle cx="12" cy="18.5" r="4.4" fill="none" ' +
            'stroke="currentColor" stroke-width="1.6"/>' +
          // mercury: bulb + rising column
          '<circle cx="12" cy="18.5" r="2.9" fill="' + color + '"/>' +
          '<rect x="10.55" y="' + mercTop.toFixed(2) + '" width="2.9" height="' +
            (stemBottom - mercTop + 2).toFixed(2) + '" rx="1.45" fill="' + color + '"/>' +
          '</svg>';
      }

      // Only the player's own guesses carry a readout. The opening bounds are
      // given, not guessed, and are explicitly not clues -- annotating them
      // would mislead.
      function wasGuessed(word) {
        for (var i = 0; i < state.guesses.length; i++) {
          if (state.guesses[i].word === word) return true;
        }
        return false;
      }

      // ---- Locking mode ---------------------------------------------------
      // A guess shares a leading run of letters with the answer; that run is,
      // by definition, correct, so it can be shown locked. We keep the longest
      // such run seen across all guesses -- knowledge only grows.
      function commonPrefixLen(a, b) {
        var n = Math.min(a.length, b.length), i = 0;
        while (i < n && a.charAt(i) === b.charAt(i)) i++;
        return i;
      }

      function updateLocks(word) {
        var k = commonPrefixLen(word, state.answer);
        if (k > state.locked.length) {
          state.locked = state.answer.slice(0, k);
        }
      }

      // The proven letter range at the first unlocked position, read only from
      // the player's own guesses that share the locked prefix. Such a guess
      // differs from the answer first at this position, so its letter here is
      // a hard edge: a lower-bound guess proves the answer's letter is AFTER
      // it, an upper-bound guess proves it is BEFORE. Returns the nearest edge
      // on each side (or null). No word list is consulted.
      function lockPositionRange() {
        var k = state.locked.length;
        var below = null, above = null;
        if (k >= state.answer.length) return { below: below, above: above };
        var target = state.answer.charAt(k);
        for (var i = 0; i < state.guesses.length; i++) {
          var w = state.guesses[i].word;
          if (w.length <= k || w.slice(0, k) !== state.locked) continue;
          var ch = w.charAt(k);
          if (ch < target) { if (below === null || ch > below) below = ch; }
          else if (ch > target) { if (above === null || ch < above) above = ch; }
        }
        return { below: below, above: above };
      }

      // The percent readout pairs a thermometer icon (heat = how close) with
      // the number. Direction is already conveyed by which side of the answer
      // the word sits on, so no arrow is needed.
      function boundHTML(word, side) {
        var html = word.toUpperCase();
        if (state.mode === "percent" && wasGuessed(word)) {
          var ratio = closenessRatio(word);
          html += '<span class="bound-meta">' + thermoIconHTML(ratio) + " " +
            closenessPct(word) + "%</span>";
        }
        return html;
      }

      function renderInput() {
        inputCardEl.classList.toggle("solved", state.solved);
        if (state.thinking) {
          inputCardEl.innerHTML = '<span class="thinking-dots"></span>';
        } else if (state.typed) {
          inputCardEl.innerHTML =
            state.typed.toUpperCase() +
            (state.gameOver ? "" : '<span class="caret"></span>');
        } else if (state.mode === "locking" && state.locked) {
          // Keep the proven letters in their slots; the rest stay as dashes.
          var len = state.answer.length;
          var parts = [];
          for (var i = 0; i < len; i++) {
            if (i < state.locked.length) {
              parts.push('<span class="slot-lock">' +
                state.locked.charAt(i).toUpperCase() + "</span>");
            } else {
              parts.push('<span class="slot-empty">&ndash;</span>');
            }
          }
          inputCardEl.innerHTML = parts.join("&nbsp;");
        } else {
          inputCardEl.innerHTML =
            '<span class="slot-empty">' + dashes(state.answer.length) + "</span>";
        }
        if (state.shake) {
          inputCardEl.classList.remove("shake");
          void inputCardEl.offsetWidth;
          inputCardEl.classList.add("shake");
          state.shake = false;
        }
      }

      function renderBounds() {
        boundTopEl.innerHTML = boundHTML(state.lower, "lower");
        boundBottomEl.innerHTML = boundHTML(state.upper, "upper");

        if (state.prevLower) {
          boundTopFarEl.innerHTML = boundHTML(state.prevLower, "lower");
          boundTopFarEl.classList.remove("empty");
        } else {
          boundTopFarEl.textContent = "";
          boundTopFarEl.classList.add("empty");
        }
        if (state.prevUpper) {
          boundBottomFarEl.innerHTML = boundHTML(state.prevUpper, "upper");
          boundBottomFarEl.classList.remove("empty");
        } else {
          boundBottomFarEl.textContent = "";
          boundBottomFarEl.classList.add("empty");
        }

        if (state.boundSide === "top") {
          boundTopEl.classList.remove("move-top");
          void boundTopEl.offsetWidth;
          boundTopEl.classList.add("move-top");
        } else if (state.boundSide === "bottom") {
          boundBottomEl.classList.remove("move-bottom");
          void boundBottomEl.offsetWidth;
          boundBottomEl.classList.add("move-bottom");
        }
        state.boundSide = null;
      }

      var lastMessage = null;
      function renderStep() {
        if (state.message === lastMessage) return;
        lastMessage = state.message;
        subtitleEl.innerHTML = state.message;
        subtitleEl.classList.remove("step-in");
        void subtitleEl.offsetWidth;
        subtitleEl.classList.add("step-in");
      }

      function renderNotice() {
        noticeEl.textContent = state.notice || "";
        noticeEl.classList.toggle("show", !!state.notice);
      }

      // Invisible in the other two arms: nothing is written to the DOM beyond
      // setting hidden, so control and locking lay out exactly as before.
      // The reading depends only on the four bound words and the answer, so the
      // heights are stable across keystrokes and the CSS transitions fire only
      // when a guess actually moves a bound.
      function renderThermo() {
        var on = state.mode === "thermometer";
        thermoEl.hidden = !on;
        thermoSpacerEl.hidden = !on;
        if (!on) return;
        var g = gaugeParts();
        thermoJawTopEl.style.height = (g.top * 100).toFixed(2) + "%";
        thermoJawBottomEl.style.height = (g.bottom * 100).toFixed(2) + "%";
      }

      function renderKeyboard() {
        var buttons = keyboardEl.querySelectorAll("button");
        buttons.forEach(function (btn) {
          btn.classList.remove("dim");
          var s;
          if (btn.dataset.action === "enter") s = enterState();
          else if (btn.dataset.action === "back")
            s = state.gameOver || state.thinking || !state.typed ? "dim" : "enabled";
          else s = keyState(btn.dataset.letter);
          if (s === "dim") btn.classList.add("dim");
        });
      }

      function render() {
        renderStep();
        renderBounds();
        renderThermo();
        renderInput();
        renderNotice();
        renderKeyboard();
        guessesLeftEl.textContent = state.guessesLeft;
      }

      // ---- Overlays ----
      var promptOverlay = document.getElementById("promptOverlay");
      var promptText = document.getElementById("promptText");
      var promptSeed = document.getElementById("promptSeed");
      var startOverlay = document.getElementById("startOverlay");
      var startSeed = document.getElementById("startSeed");
      var startVisible = true;

      function seedLabel(seed) {
        return "Puzzle seed " + seed;
      }

      function showPrompt(html) {
        promptText.innerHTML = html;
        promptSeed.textContent = seedLabel(state.seed);
        promptOverlay.hidden = false;
      }

      function hidePrompt() {
        promptOverlay.hidden = true;
      }

      function showStart() {
        hidePrompt();
        startSeed.textContent = seedLabel(currentSeed);
        startOverlay.hidden = false;
        startVisible = true;
      }

      function hideStart() {
        startOverlay.hidden = true;
        startVisible = false;
      }

      function newGame(mode, seed) {
        hidePrompt();
        hideStart();
        currentSeed = seed;
        var puzzle = buildPuzzle(seed, mode);
        if (!puzzle) {
          // Only reachable if the lists or the constants are inconsistent.
          state = null;
          console.error("[sandwich] could not build a puzzle", { seed: seed });
          return;
        }
        state = initialState({ mode: mode, seed: seed, puzzle: puzzle });
        lastMessage = null;
        logEvent("puzzle", {
          answerLength: state.answer.length,
          windowWords: puzzle.window,
          allWordsInWindow: wordsBetween(puzzle.lower, puzzle.upper),
          lower: puzzle.lower,
          upper: puzzle.upper
        });
        render();
      }

      startOverlay.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        // Advance the seed so choosing a mode always starts a fresh puzzle,
        // rather than replaying the same answer in a different mode.
        newGame(btn.dataset.mode, currentSeed + 1);
        logEvent("mode_chosen", {
          answerLength: state.answer.length,
          windowWords: WINDOW_WORDS,
          allWordsInWindow: wordsBetween(state.startLower, state.startUpper)
        });
      });

      // "Play again" advances the seed; "Change mode" keeps it, so the same
      // puzzle can be replayed in another arm. Both wrapped, because newGame
      // takes arguments and would otherwise receive the MouseEvent.
      document.getElementById("promptAgain").addEventListener("click", function () {
        newGame(state.mode, currentSeed + 1);
      });
      document.getElementById("promptModes").addEventListener("click", function () {
        showStart();
      });

      // Physical keyboard support
      document.addEventListener("keydown", function (e) {
        if (startVisible || !state || state.gameOver) return;
        if (e.key === "Enter") {
          e.preventDefault();
          submit();
        } else if (e.key === "Backspace") {
          e.preventDefault();
          backspace();
        } else if (/^[a-zA-Z]$/.test(e.key)) {
          typeLetter(e.key.toLowerCase());
        }
      });

      // ---- Boot ----
      (function boot() {
        // Integrity: every ANSWERS entry must be a legal word.
        var orphans = [];
        for (var i = 0; i < ANSWERS.length; i++) {
          if (!RANK.has(ANSWERS[i])) orphans.push(ANSWERS[i]);
        }
        if (orphans.length) {
          console.error("[sandwich] ANSWERS entries missing from WORDS",
            orphans.slice(0, 20));
        }

        currentSeed = QUERY.seed === null ? randomSeed() : QUERY.seed;
        buildKeyboard();

        // Render the board behind the start screen so it isn't blank.
        var mode = QUERY.mode || "percent";
        newGame(mode, currentSeed);

        if (QUERY.mode) {
          logEvent("mode_chosen", {
            answerLength: state.answer.length,
            windowWords: WINDOW_WORDS,
            allWordsInWindow: wordsBetween(state.startLower, state.startUpper),
            via: "query"
          });
        } else {
          showStart();
        }
      })();
    })();
  </script>
</body>
</html>
